apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  ports:
    - name: http
      port: 8080
      targetPort: http
  selector:
    app: api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      initContainers:
        - name: migrate
          image: travel-crm-ai-api:local
          imagePullPolicy: IfNotPresent
          command: ["python", "scripts/migrate.py"]
          envFrom:
            - configMapRef:
                name: voyageops-config
          env:
            - name: RDS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: voyageops-secrets
                  key: RDS_PASSWORD
      containers:
        - name: api
          image: travel-crm-ai-api:local
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8080"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: voyageops-config
          env:
            - name: RDS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: voyageops-secrets
                  key: RDS_PASSWORD
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: voyageops-secrets
                  key: SECRET_KEY
            - name: MOCKPAY_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: voyageops-secrets
                  key: MOCKPAY_WEBHOOK_SECRET
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
