services:
  api:
    build: .
    image: travel-crm-ai-api
    command: ["sh", "-c", "python scripts/migrate.py && exec uvicorn app:app --reload --host 0.0.0.0 --port 8080"]
    ports:
      - "8080:8080"
    volumes:
      - .:/app
    environment:
      SECRET_KEY: local-development-secret-change-me
      ALGORITHM: HS256
      DB_USER: travel_crm
      RDS_HOST: mysql
      RDS_PASSWORD: travel_crm
      DB_NAME: travel_crm
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CORS_ORIGINS: http://localhost:3000,http://localhost:8080
      ENABLE_MOCK_PAYMENT: "true"
      MOCKPAY_WEBHOOK_SECRET: local-mockpay-secret
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-mockpay}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-mock-email}
      AI_PLANNING_PROVIDER: ${AI_PLANNING_PROVIDER:-local}
      AI_OPERATIONS_PROVIDER: ${AI_OPERATIONS_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      GEMINI_FALLBACK_MODEL: ${GEMINI_FALLBACK_MODEL:-gemini-3.5-flash-lite}
      AI_PROVIDER_TIMEOUT_MS: ${AI_PROVIDER_TIMEOUT_MS:-20000}
      AI_PROVIDER_MAX_RETRIES: ${AI_PROVIDER_MAX_RETRIES:-2}
      AI_PROVIDER_MAX_OUTPUT_TOKENS: ${AI_PROVIDER_MAX_OUTPUT_TOKENS:-8192}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  worker:
    build: .
    image: travel-crm-ai-api
    command: ["python", "scripts/worker.py"]
    volumes:
      - .:/app
    environment:
      DB_USER: travel_crm
      RDS_HOST: mysql
      RDS_PASSWORD: travel_crm
      DB_NAME: travel_crm
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-2}
      REMINDER_SCAN_INTERVAL_SECONDS: ${REMINDER_SCAN_INTERVAL_SECONDS:-300}
      WORKER_MAX_ATTEMPTS: ${WORKER_MAX_ATTEMPTS:-5}
      WORKER_RETRY_BASE_SECONDS: ${WORKER_RETRY_BASE_SECONDS:-10}
      WORKER_RETRY_MAX_SECONDS: ${WORKER_RETRY_MAX_SECONDS:-900}
      WORKER_LEASE_SECONDS: ${WORKER_LEASE_SECONDS:-60}
    depends_on:
      api:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: travel_crm
      MYSQL_USER: travel_crm
      MYSQL_PASSWORD: travel_crm
      MYSQL_ROOT_PASSWORD: local-root-password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./migrations/001_initial_crm.sql:/docker-entrypoint-initdb.d/001_initial_crm.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-plocal-root-password"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql_data:
